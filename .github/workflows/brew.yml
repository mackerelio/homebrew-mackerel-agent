name: brew

on:
  repository_dispatch:
    types: [release]

jobs:
  brew:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: brew config

    - run: ruby tools/update.rb ${{ github.event.client_payload.product }} latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: github.event.client_payload

    - run: brew install ./${{ github.event.client_payload.product }}.rb
      if: github.event.client_payload
      env:
        HOMEBREW_DEVELOPER: true

    - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      if: github.event.client_payload
      with:
        commit_message: Update ${{ github.event.client_payload.product }}

